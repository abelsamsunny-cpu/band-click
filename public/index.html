<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Band Click</title>
<style>
:root{--bg:#fff;--fg:#111;--card:#f2f2f2;--acc:#d33}
@media (prefers-color-scheme:dark){:root{--bg:#111;--fg:#eee;--card:#222}}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:16px;max-width:480px;margin:auto}
h1{font-size:20px}
label{display:block;margin:12px 0 4px;font-size:14px}
input{width:100%;box-sizing:border-box;font-size:22px;padding:10px;border-radius:8px;border:1px solid #888;background:var(--card);color:var(--fg)}
button{width:100%;font-size:22px;padding:16px;margin-top:14px;border:0;border-radius:10px;background:var(--acc);color:#fff}
button.grey{background:#555}
#flash{height:70px;border-radius:10px;background:var(--card);margin-top:14px;text-align:center;line-height:70px;font-size:28px}
#status{margin-top:12px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<h1>Band Click</h1>
<button id="audio">1. Enable audio</button>
<label>BPM</label><input id="bpm" type="number" value="120" inputmode="decimal">
<label>Beats per bar</label><input id="bpb" type="number" value="4" inputmode="numeric">
<label>My latency trim (ms, + = later)</label><input id="trim" type="number" value="0" inputmode="numeric">
<button id="go">2. Start for everyone</button>
<button id="stop" class="grey">Stop for everyone</button>
<div id="flash">–</div>
<div id="status"></div>
<script>
const $ = id => document.getElementById(id);
let ws, ctx = null, offset = null, state = null, idx = 0, count = 1, rtt = null;
let pid = 0; const pending = {};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const serverNow = () => performance.now() + offset;

function status() {
  $('status').innerHTML =
    (ws && ws.readyState === 1 ? 'Connected' : 'Connecting…') + ' · devices: ' + count +
    '<br>Clock sync: ' + (offset === null ? 'measuring…' : 'best round trip ' + rtt.toFixed(1) + ' ms') +
    '<br>Audio: ' + (ctx && ctx.state === 'running' ? 'on' : 'tap “Enable audio”') +
    '<br>' + (state ? 'Running at ' + state.bpm + ' BPM' : 'Stopped');
}

function ping() {
  return new Promise(res => {
    const id = ++pid; pending[id] = res;
    ws.send(JSON.stringify({ type: 'ping', id }));
    setTimeout(() => { if (pending[id]) { delete pending[id]; res(null); } }, 1000);
  });
}

async function sync() {
  const s = [];
  for (let i = 0; i < 30; i++) {
    const t0 = performance.now();
    const r = await ping();
    const t1 = performance.now();
    if (r) s.push({ rtt: t1 - t0, off: r.ts - (t0 + t1) / 2 });
    await sleep(15);
  }
  if (s.length < 5) return;
  s.sort((a, b) => a.rtt - b.rtt);
  const best = s.slice(0, 5);
  const off = best.map(x => x.off).sort((a, b) => a - b)[2];
  offset = offset === null ? off : offset + 0.3 * (off - offset);
  rtt = best[0].rtt;
  status();
}

function connect() {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss' : 'ws') + '://' + location.host);
  ws.onopen = () => { status(); sync(); };
  ws.onclose = () => { status(); setTimeout(connect, 1000); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type === 'pong') { const f = pending[m.id]; if (f) { delete pending[m.id]; f(m); } }
    else if (m.type === 'count') { count = m.n; status(); }
    else if (m.type === 'state') {
      state = m.state;
      if (state && offset !== null) {
        const spb = 60000 / state.bpm;
        idx = Math.max(0, Math.ceil((serverNow() + 150 - state.startAt) / spb));
      }
      if (!state) $('flash').textContent = '–';
      status();
    }
  };
}

function click(t, accent) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(0.9, t + 0.002);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g).connect(ctx.destination);
  o.start(t); o.stop(t + 0.06);
}

function tick() {
  if (!state || !ctx || ctx.state !== 'running' || offset === null) return;
  // map performance clock -> audio clock (accounts for output latency where supported)
  let aCtx = ctx.currentTime, aPerf = performance.now();
  if (ctx.getOutputTimestamp) {
    const ts = ctx.getOutputTimestamp();
    if (ts.contextTime > 0 && ts.performanceTime > 0) { aCtx = ts.contextTime; aPerf = ts.performanceTime; }
  }
  const trim = (+$('trim').value || 0) / 1000;
  const toCtx = ms => aCtx + ((ms - offset) - aPerf) / 1000 + trim;
  const spb = 60000 / state.bpm;
  for (;;) {
    const t = toCtx(state.startAt + idx * spb);
    if (t > ctx.currentTime + 0.15) break;
    if (t >= ctx.currentTime - 0.01) {
      const beat = idx % state.bpb;
      click(t, beat === 0);
      const n = beat + 1;
      setTimeout(() => { if (state) $('flash').textContent = n; }, Math.max(0, (t - ctx.currentTime) * 1000));
    }
    idx++;
  }
}

$('audio').onclick = async () => {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  await ctx.resume();
  status();
};
$('go').onclick = () => ws.send(JSON.stringify({ type: 'start', bpm: $('bpm').value, bpb: $('bpb').value }));
$('stop').onclick = () => ws.send(JSON.stringify({ type: 'stop' }));

connect();
setInterval(tick, 25);
setInterval(() => { if (ws.readyState === 1) sync(); }, 15000);
status();
</script>
</body>
</html>
